services:
  - type: web
    name: plum-opd-adjudicator-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_TEXT_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_MAX_RETRIES
        value: "3"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: REVIEWER_TOKEN
        sync: false
      - key: RATE_LIMIT_PER_10_MIN
        value: "20"
